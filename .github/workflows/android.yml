name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://biovault-backend-d13a.onrender.com' }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://biovault-backend-d13a.onrender.com' }}
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL || 'https://biovault-backend-d13a.onrender.com' }}
          VITE_BIOMETRIC_API_URL: ${{ secrets.VITE_BIOMETRIC_API_URL || 'https://biovault-backend-d13a.onrender.com' }}
          VITE_FORCE_REMOTE: 'true'

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Rename APK with build metadata
        working-directory: android/app/build/outputs/apk/debug
        run: |
          DATE=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          mv app-debug.apk "PINITVault-${DATE}-${SHORT_SHA}.apk"
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PINITVault-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
